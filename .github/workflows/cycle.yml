name: Rasd Cycle — دورة الرصد

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "كم ساعة للخلف نجمع؟ (الافتراضي 24)"
        required: false
        default: "24"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: إحضار ملفات المستودع
        uses: actions/checkout@v4

      - name: تجهيز Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: تشغيل جامع الأخبار
        env:
          WINDOW_HOURS: ${{ inputs.hours }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: node scripts/collect.mjs

      - name: حفظ النتيجة داخل المستودع
        run: |
          git config user.name "rasd-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "دورة رصد" || echo "لا جديد لحفظه"
          git push
